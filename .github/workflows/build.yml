name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          for i in 1 2 3 4 5; do
            if curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip; then
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep 10
          done
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Publish APK
        run: gh release create build-${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ github.token }}
